apiVersion: apps/v1
kind: Deployment
metadata:
  name: databeez-ui
  namespace: databeez
  labels:
    app: databeez-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: databeez-ui
  template:
    metadata:
      labels:
        app: databeez-ui
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: databeez-ui
          image: databeezregistry.azurecr.io/databeez-ui:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
